[project]
name = "golden-ratio-dual-gate"
version = "0.1.0"
description = "SPY/TIP dual-gate trend-timed leveraged portfolio: backtest and research"
readme = "README.md"
authors = [
    { name = "carpet-stain", email = "5483606+carpet-stain@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_ratio_dual_gate"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3.260530",
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
